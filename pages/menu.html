<h2>Daftar Menu</h2>
<div class="tools">
  <input type="search" id="cari" placeholder="Cari menu atau penjual...">
  <select id="urut" class="kecil">
    <option value="nama">Urutkan: Nama A–Z</option>
    <option value="murah">Harga termurah</option>
    <option value="mahal">Harga termahal</option>
  </select>
</div>
<div id="kategori" class="tools">
  <button class="chip aktif" data-k="Semua">Semua</button>
  <button class="chip" data-k="Makanan">Makanan</button>
  <button class="chip" data-k="Minuman">Minuman</button>
  <button class="chip" data-k="Snack">Snack</button>
</div>
<p id="jumlah" class="muted"></p>
<div id="grid" class="grid"></div>
